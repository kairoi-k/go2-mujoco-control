schema_version: policy.v1
policy_id: b0
status: wip
purpose: Sensor-only development and holdout contracts; terrain observation must not actuate the controller.
allowed_profiles:
  - b0-development
  - b0-holdout
allowed_activity_names:
  - build_source
  - run_unit_tests
  - run_dev_probe
  - run_b0_member
  - run_b0_holdout
  - extract_failure_window
  - diagnose_with_local_llm
  - classify_campaign
max_duration_s: 900
allowed_parameter_names:
  - fixture_verdict
  - scenario
  - domain_id
  - force_local_llm
controller_mutation_allowed: false
acceptance_claim_allowed: false
requires_human_approval_for_formal: false
notes:
  - WIP contract only; the worker may compute an automatic PASS/FAIL receipt but must not make an external acceptance claim.
  - Autonomous execution is allowed only through the frozen manifest and all 18 members; a failure is a valid terminal outcome.
  - The Atlas adapter must use an allowlisted operation map, never arbitrary shell from a spec.
