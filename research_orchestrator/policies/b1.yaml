schema_version: policy.v1
policy_id: b1
status: draft
purpose: B1 probe contract reserved for later Atlas integration and explicit review.
allowed_profiles:
  - b1-probe
allowed_activity_names:
  - build_source
  - run_unit_tests
  - run_dev_probe
  - run_b1_probe
  - extract_failure_window
  - classify_campaign
max_duration_s: 900
allowed_parameter_names:
  - fixture_verdict
  - scenario
  - domain_id
controller_mutation_allowed: false
acceptance_claim_allowed: false
requires_human_approval_for_formal: false
notes:
  - Draft contract only; autonomous B1 execution is blocked unless the same run has a current B0 PASS receipt.
  - No controller algorithm, physics setting, or acceptance threshold may be changed by the worker.
