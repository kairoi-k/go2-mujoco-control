name: Stage-C recovery patch

on:
  push:
    branches:
      - assistant/stage-c-gait-contact-ownership-20260902
    paths:
      - .github/workflows/stage-c-recovery-patch.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: assistant/stage-c-gait-contact-ownership-20260902
          fetch-depth: 1

      - name: Apply bounded recovery-handoff fix
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("example/cpp/terrain/terrain_plan_execution_adapter.h")
          text = path.read_text()

          def block(lines):
              return "\n".join(lines) + "\n"

          replacements = [
              (
                  block([
                      "        adopted_.reset();",
                      "        using_plan_ = false;",
                      "        fallback_age_steps_ = 0;",
                  ]),
                  block([
                      "        adopted_.reset();",
                      "        using_plan_ = false;",
                      "        recovery_pending_ = false;",
                      "        fallback_age_steps_ = 0;",
                  ]),
                  "reset",
              ),
              (
                  block([
                      "        for (bool flight : in_flight_)",
                      "            if (flight)",
                      "                return false;",
                      "        return AtEventBoundary(*adopted_, now_s);",
                  ]),
                  block([
                      "        for (bool flight : in_flight_)",
                      "            if (flight)",
                      "                return false;",
                      "        // A safety fallback has retired execution ownership; the stale",
                      "        // snapshot may remain for provenance but no longer owns a future",
                      "        // liftoff/touchdown boundary for recovery handoff.",
                      "        if (recovery_pending_)",
                      "            return true;",
                      "        return AtEventBoundary(*adopted_, now_s);",
                  ]),
                  "legal-boundary",
              ),
              (
                  block([
                      "                adopted_ = std::make_shared<const TerrainMotionPlan>(*candidate);",
                      "                result.adopted = true;",
                      "                result.adopted_plan_id = candidate->plan_id;",
                  ]),
                  block([
                      "                adopted_ = std::make_shared<const TerrainMotionPlan>(*candidate);",
                      "                recovery_pending_ = false;",
                      "                result.adopted = true;",
                      "                result.adopted_plan_id = candidate->plan_id;",
                  ]),
                  "adopt-clear",
              ),
              (
                  block([
                      "        const bool guard_safe_stop = contact_guard_active_ &&",
                      "            contact_guard_age_ticks_ >= 5;",
                      "        if (adopted_ && !guard_safe_stop && std::isfinite(now_s) &&",
                      "            now_s <= adopted_->valid_until_s + grace_s_)",
                  ]),
                  block([
                      "        const bool guard_safe_stop = contact_guard_active_ &&",
                      "            contact_guard_age_ticks_ >= 5;",
                      "        // Once safety fallback interrupts an adopted transaction, do not",
                      "        // silently resume that stale timing after contact recovers. Hold",
                      "        // measured-support fallback until a fresh whole snapshot is adopted.",
                      "        if (adopted_ && (guard_safe_stop ||",
                      "            (std::isfinite(now_s) &&",
                      "             now_s > adopted_->valid_until_s + grace_s_)))",
                      "            recovery_pending_ = true;",
                      "        const bool hold_for_recovery = recovery_pending_ && !result.adopted;",
                      "        if (adopted_ && !guard_safe_stop && !hold_for_recovery &&",
                      "            std::isfinite(now_s) &&",
                      "            now_s <= adopted_->valid_until_s + grace_s_)",
                  ]),
                  "recovery-latch",
              ),
              (
                  block([
                      "    bool using_plan_ = false;",
                      "    std::size_t fallback_age_steps_ = 0;",
                  ]),
                  block([
                      "    bool using_plan_ = false;",
                      "    bool recovery_pending_ = false;",
                      "    std::size_t fallback_age_steps_ = 0;",
                  ]),
                  "state-field",
              ),
          ]

          for old, new, label in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f"{label} patch site count={text.count(old)}")
              text = text.replace(old, new)
          path.write_text(text)

          cmake = Path("example/cpp/CMakeLists.txt")
          text = cmake.read_text()
          old = block([
              "add_executable(test_terrain_plan_fallback tests/test_terrain_plan_fallback.cpp)",
              "target_link_libraries(test_terrain_plan_fallback unitree_sdk2)",
              "go2_add_ctest(test_terrain_plan_fallback)",
          ])
          new = old + "\n" + block([
              "# Stage-C safe-stop recovery must not resume an interrupted stale plan.",
              "add_executable(test_terrain_plan_recovery tests/test_terrain_plan_recovery.cpp)",
              "target_link_libraries(test_terrain_plan_recovery unitree_sdk2)",
              "go2_add_ctest(test_terrain_plan_recovery)",
          ])
          if text.count(old) != 1:
              raise SystemExit(f"CMake recovery test site count={text.count(old)}")
          cmake.write_text(text.replace(old, new))
          PY

      - name: Bootstrap Ubuntu dependencies and build
        env:
          MUJOCO_VERSION: "3.3.6"
        run: bash scripts/setup_ubuntu_env.sh

      - name: Run focused Stage-C regressions
        run: |
          ctest --test-dir example/cpp/build -R 'test_terrain_plan_recovery|test_terrain_plan_fallback|test_terrain_interfaces|test_raibert_trot_kernel' --output-on-failure

      - name: Persist verified recovery fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add example/cpp/terrain/terrain_plan_execution_adapter.h example/cpp/CMakeLists.txt
          git diff --cached --check
          git commit -m "fix: recover Stage-C handoff after contact safe-stop"
          git push origin HEAD:assistant/stage-c-gait-contact-ownership-20260902
