name: Stage-C recovery proof

on:
  push:
    branches:
      - assistant/stage-c-gait-contact-ownership-20260902
    paths:
      - .github/workflows/stage-c-recovery-patch.yml

permissions:
  contents: write

jobs:
  recovery-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: assistant/stage-c-gait-contact-ownership-20260902
          fetch-depth: 1

      - name: Apply corrected recovery-handoff patch
        run: python3 scripts/dev_stage_c_recovery_patch.py

      - name: Bootstrap Ubuntu dependencies and build
        env:
          MUJOCO_VERSION: "3.3.6"
        run: bash scripts/setup_ubuntu_env.sh

      - name: Run focused Stage-C regressions
        run: |
          ctest --test-dir example/cpp/build -R 'test_terrain_plan_recovery|test_terrain_plan_fallback|test_terrain_interfaces|test_raibert_trot_kernel' --output-on-failure

      - name: Run full static guardrails
        run: |
          ctest --test-dir example/cpp/build --output-on-failure
          ctest --test-dir simulate/build --output-on-failure

      - name: Run bounded 5cm recovery probe
        env:
          TROT_TERRAIN_BOOTSTRAP_DEV: "1"
          TROT_TERRAIN_SHADOW_DIAGNOSTICS: "1"
          TROT_TERRAIN_DEBUG_SELECTION: "1"
          TROT_TERRAIN_DEBUG_SUPPORT_POLYGON: "1"
          TROT_CPU_AUTOPIN: "1"
          SIM_LOCKSTEP: "1"
          SIM_LOCKSTEP_BARRIER_TIMEOUT_S: "120"
          SIM_LOCKSTEP_EXCHANGE_TIMEOUT_S: "5"
          SIM_LOCKSTEP_STEP_TIMEOUT_S: "5"
        run: |
          set +e
          run_name="_runs/stage_c_recovery_5cm_${GITHUB_RUN_ID}"
          bash example/cpp/scripts/run_trot.sh 50 "$run_name" \
            --controller-duration 30 \
            --scene-file unitree_robots/go2/phase2_step_5cm.xml \
            --headless \
            --wbc-full \
            --gait-pattern running-trot \
            --kernel raibert-trot \
            --velocity-command-script example/cpp/configs/phase2_b1_velocity_0p3.csv \
            --wall-clock-motion \
            --support-anchor-feedback --support-anchor-gain 0.35 \
            --period 0.50 --duty 0.75 \
            --step-length 0.13 --foot-lift 0.06 \
            --wbc-reduced-contact-task \
            --wbc-task-torque-feedforward \
            --terrain-planner \
            --stage-c-execution \
            --domain-id 233
          echo "WRAPPER_STATUS=$?" | tee probe_status.txt
          exit 0

      - name: Verify atomic consumers and summarize recovery
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          import pandas as pd

          runs = sorted(Path("example/cpp/experiments/_runs").glob("stage_c_recovery_5cm_*"))
          if not runs:
              raise SystemExit("no recovery probe run directory")
          run = runs[-1]
          data = run / "data.csv"
          log_path = run / "controller.log"
          if not data.exists() or not log_path.exists():
              raise SystemExit("recovery probe missing data/log")

          df = pd.read_csv(data, low_memory=False)
          def numeric(name):
              if name not in df.columns:
                  return None
              return pd.to_numeric(df[name], errors="coerce")

          stop = numeric("terrain_safe_stop_requested")
          using = numeric("terrain_execution_adapter_using_plan")
          adoptions = numeric("terrain_execution_adapter_adoptions")
          base_x = numeric("world_base_x_m")
          adopted = numeric("terrain_execution_adopted_plan_id")
          stop_rows = [] if stop is None else list(df.index[stop > 0])
          print(f"RECOVERY_PROBE rows={len(df)} safe_stop_rows={len(stop_rows)}")
          if base_x is not None and base_x.notna().any():
              print(f"RECOVERY_PROBE max_world_base_x_m={float(base_x.max())}")
          if adoptions is not None and adoptions.notna().any():
              print(f"RECOVERY_PROBE adapter_adoptions_max={float(adoptions.max())}")
          if adopted is not None and adopted.notna().any():
              ids = sorted(set(int(v) for v in adopted.dropna() if v > 0))
              print(f"RECOVERY_PROBE adopted_plan_ids={ids[:30]}")
          if stop_rows:
              i = int(stop_rows[0])
              print(f"RECOVERY_PROBE first_safe_stop_index={i}")
              if using is not None and i + 1 < len(using):
                  print(f"RECOVERY_PROBE using_plan_after_stop_max={float(using.loc[i+1:].max())}")
              if adoptions is not None and adoptions.notna().any():
                  before = float(adoptions.loc[:i].max())
                  after = before
                  if i + 1 < len(adoptions):
                      after = float(adoptions.loc[i+1:].max())
                  print(f"RECOVERY_PROBE adoptions_before_stop={before} after_stop={after}")

          log = log_path.read_text(errors="replace")
          rx = re.compile(
              r"STAGE_C_IDENTITY consumer=(gait|mpc) plan_id=(\d+) "
              r"plan_epoch=(\d+) map_epoch=(\d+) input_hash=(\d+) "
              r"adapter_plan_id=(\d+) match=(\d+)")
          by = {"gait": set(), "mpc": set()}
          for consumer, pid, pep, mep, ih, adapter_pid, match in rx.findall(log):
              tup = tuple(map(int, (pid, pep, mep, ih)))
              if int(match) != 1 or int(adapter_pid) != int(pid):
                  raise SystemExit(f"identity mismatch consumer={consumer} tuple={tup}")
              by[consumer].add(tup)
          if not by["gait"] or not by["mpc"]:
              raise SystemExit(f"missing Stage-C consumer identity evidence: {by}")
          common = by["gait"] & by["mpc"]
          if not common:
              raise SystemExit(f"gait/MPC share no atomic plan identity: {by}")
          print(f"ATOMIC_IDENTITY_PASS common={sorted(common)}")
          PY

      - name: Persist verified recovery fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add example/cpp/terrain/terrain_plan_execution_adapter.h \
                  example/cpp/tests/test_terrain_plan_recovery.cpp \
                  example/cpp/CMakeLists.txt
          git diff --cached --check
          git commit -m "fix: recover Stage-C only after contact guard clears"
          git push origin HEAD:assistant/stage-c-gait-contact-ownership-20260902

      - name: Upload recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage-c-recovery-5cm-${{ github.run_id }}
          path: |
            example/cpp/experiments/_runs/stage_c_recovery_5cm_*/
            probe_status.txt
          if-no-files-found: warn
          retention-days: 7
