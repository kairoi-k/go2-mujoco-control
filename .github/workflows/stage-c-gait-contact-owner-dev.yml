name: Stage-C gait contact ownership development proof

on:
  push:
    branches:
      - assistant/stage-c-gait-contact-ownership-20260902
    paths:
      - .github/workflows/stage-c-gait-contact-owner-dev.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stage-c-gait-contact-owner-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply planner-owned gait contact slice
        run: python3 scripts/dev_stage_c_gait_owner_patch.py

      - name: Bootstrap Ubuntu dependencies and build
        env:
          MUJOCO_VERSION: "3.3.6"
        run: bash scripts/setup_ubuntu_env.sh

      - name: Run static CTest guardrails
        run: |
          ctest --test-dir example/cpp/build --output-on-failure
          ctest --test-dir simulate/build --output-on-failure

      - name: Run bounded 5cm development probe
        id: probe
        continue-on-error: true
        env:
          TROT_TERRAIN_BOOTSTRAP_DEV: "1"
          TROT_TERRAIN_SHADOW_DIAGNOSTICS: "1"
          TROT_CPU_AUTOPIN: "1"
          SIM_LOCKSTEP: "1"
          SIM_LOCKSTEP_BARRIER_TIMEOUT_S: "120"
          SIM_LOCKSTEP_EXCHANGE_TIMEOUT_S: "5"
          SIM_LOCKSTEP_STEP_TIMEOUT_S: "5"
        run: |
          set +e
          run_name="_runs/stage_c_gait_owner_${GITHUB_RUN_ID}"
          bash example/cpp/scripts/run_trot.sh 50 "$run_name" \
            --controller-duration 30 \
            --scene-file unitree_robots/go2/phase2_step_5cm.xml \
            --headless \
            --wbc-full \
            --gait-pattern running-trot \
            --kernel raibert-trot \
            --velocity-command-script example/cpp/configs/phase2_b1_velocity_0p3.csv \
            --wall-clock-motion \
            --support-anchor-feedback --support-anchor-gain 0.35 \
            --period 0.50 --duty 0.75 \
            --step-length 0.13 --foot-lift 0.06 \
            --wbc-reduced-contact-task \
            --wbc-task-torque-feedforward \
            --terrain-planner \
            --stage-c-execution \
            --domain-id 231
          echo "wrapper_status=$?" | tee "$GITHUB_WORKSPACE/probe_status.txt"
          exit 0

      - name: Verify gait and MPC consumed one atomic plan
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          import pandas as pd

          runs = sorted(Path("example/cpp/experiments/_runs").glob("stage_c_gait_owner_*"))
          if not runs:
              raise SystemExit("no development run directory")
          run = runs[-1]
          data_path = run / "data.csv"
          log_path = run / "controller.log"
          if not data_path.exists() or not log_path.exists():
              raise SystemExit("probe evidence missing")

          log = log_path.read_text(errors="replace")
          rx = re.compile(
              r"STAGE_C_IDENTITY consumer=(gait|mpc) plan_id=(\d+) "
              r"plan_epoch=(\d+) map_epoch=(\d+) input_hash=(\d+) "
              r"adapter_plan_id=(\d+) match=(\d+)")
          seen = {"gait": set(), "mpc": set()}
          for consumer, pid, pep, mep, ih, adapter_pid, match in rx.findall(log):
              tup = tuple(map(int, (pid, pep, mep, ih)))
              if int(match) != 1 or int(adapter_pid) != int(pid):
                  raise SystemExit(f"identity mismatch {consumer} {tup}")
              seen[consumer].add(tup)
          if not seen["gait"]:
              raise SystemExit("no gait consumer identity evidence")
          if not seen["mpc"]:
              raise SystemExit("no MPC consumer identity evidence")
          common = seen["gait"] & seen["mpc"]
          if not common:
              raise SystemExit(f"gait/MPC atomic tuple mismatch: {seen}")

          df = pd.read_csv(data_path, low_memory=False)
          adopted = pd.to_numeric(df["terrain_execution_adopted_plan_id"], errors="coerce")
          adopted_ids = set(int(v) for v in adopted.dropna() if v > 0)
          common = [t for t in common if t[0] in adopted_ids]
          if not common:
              raise SystemExit("common tuple missing from adapter adoption telemetry")
          safe_stop = pd.to_numeric(df["terrain_safe_stop_requested"], errors="coerce").max()
          max_x = pd.to_numeric(df["world_base_x_m"], errors="coerce").max()
          print(f"GAIT_CONTACT_OWNERSHIP_PASS common={sorted(common)}")
          print(f"SAFE_STOP_MAX={safe_stop}")
          print(f"MAX_WORLD_BASE_X={max_x}")
          PY

      - name: Persist verified source slice
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add example/cpp/gait/locomotion_kernel.h \
                  example/cpp/gait/raibert_trot_kernel.h \
                  example/cpp/terrain/terrain_plan_execution_adapter.h \
                  example/cpp/tests/test_raibert_trot_kernel.cpp \
                  example/cpp/trot/trot_experiment_gait.cpp \
                  example/cpp/trot/trot_experiment_wbc.cpp
          git commit -m "fix: let Stage-C plan own Raibert contact state"
          git push origin HEAD:assistant/stage-c-gait-contact-ownership-20260902
