name: Bootstrap runtime integrator

on:
  push:
    branches:
      - assistant/bootstrap-static-fixes-20260902

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Apply bootstrap runtime follow-up
        run: python3 scripts/apply_bootstrap_runtime_followup.py

      - name: Commit integration
        run: |
          if git diff --quiet; then
            echo "No integration changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add example/cpp/terrain/terrain_bootstrap_c0.h \
                  example/cpp/trot/trot_experiment_control.cpp \
                  example/cpp/trot/trot_experiment_gait.cpp \
                  example/cpp/trot/trot_experiment_wbc.cpp \
                  example/cpp/tests/test_terrain_bootstrap_c0.cpp
          git commit -m "fix: harden development C0-C1 bootstrap runtime"
          git push origin HEAD:assistant/bootstrap-static-fixes-20260902
