name: Bootstrap static CI

on:
  push:
    branches:
      - assistant/bootstrap-static-fixes-20260902
  workflow_dispatch:

jobs:
  build-and-ctest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Bootstrap Ubuntu dependencies and build
        env:
          MUJOCO_VERSION: "3.3.6"
        run: bash scripts/setup_ubuntu_env.sh

      - name: Run example/cpp CTest
        run: ctest --test-dir example/cpp/build --output-on-failure

      - name: Run simulate CTest
        run: ctest --test-dir simulate/build --output-on-failure
